name: CI

on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testbenches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHDL_VERSION: v4.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL and RISC-V toolchain from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Fall back to official GHDL release if apt version < 4.0
        run: |
          major=$(ghdl --version 2>/dev/null | grep -oP 'GHDL \K[0-9]+' | head -1 || true)
          echo "apt GHDL major version: ${major:-none}"
          if [ -z "$major" ] || [ "$major" -lt 4 ]; then
            sudo apt-get remove -y 'ghdl*' || true
            url="https://github.com/ghdl/ghdl/releases/download/${GHDL_VERSION}/ghdl-mcode-${GHDL_VERSION#v}-ubuntu22.04-x86_64.tgz"
            mkdir -p "$HOME/ghdl"
            curl -fsSL "$url" | tar -xz -C "$HOME/ghdl" --strip-components=1
            echo "$HOME/ghdl/bin" >> "$GITHUB_PATH"
          fi
      - name: Tool versions
        run: |
          ghdl --version
          riscv64-unknown-elf-gcc --version | head -1
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 -print-libgcc-file-name
          riscv64-unknown-elf-gcc -march=rv32i_zicsr -mabi=ilp32 -print-libgcc-file-name
      - name: Run testbenches
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh
      - name: C program on wren (ctest)
        if: ${{ !cancelled() }}
        run: |
          chmod +x ctest.sh
          ./ctest.sh
      - name: Memory-mapped I/O program on wren (io)
        if: ${{ !cancelled() }}
        run: |
          chmod +x ctest.sh io.sh
          ./io.sh
      - name: Interrupts on wren (irq, random button presses)
        if: ${{ !cancelled() }}
        run: |
          chmod +x irq.sh
          N_RUNS=5 ./irq.sh
      - name: Upload testbench logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ghdl-logs
          path: /tmp/*.log
          if-no-files-found: warn
      - name: Upload ctest build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-build
          path: |
            build/*/*.dis
            build/*/*.hex
            build/*/*.log
            build/*/start.s
            build/*/link.ld
            build/irq/irq.elf
          if-no-files-found: warn